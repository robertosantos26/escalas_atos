name: Enviar notificacoes WhatsApp

on:
  schedule:
    - cron: '0 12 * * *'   # todo dia as 12:00 UTC (09:00 no horario de Brasilia) - ajuste como quiser
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions do GitHub

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Enviar mensagens pendentes
        run: npm run send
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
